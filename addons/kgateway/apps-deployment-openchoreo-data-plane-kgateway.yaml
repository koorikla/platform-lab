# Source: kgateway/charts/kgateway/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kgateway
  namespace: openchoreo-data-plane
  labels:
    helm.sh/chart: kgateway-v2.3.1
    kgateway: kgateway
    app.kubernetes.io/name: kgateway
    app.kubernetes.io/instance: kgateway
    app.kubernetes.io/version: "v2.3.1"
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      kgateway: kgateway
      app.kubernetes.io/name: kgateway
      app.kubernetes.io/instance: kgateway
  template:
    metadata:
      annotations:
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9092"
        prometheus.io/scrape: "true"
      labels:
        kgateway: kgateway
        app.kubernetes.io/name: kgateway
        app.kubernetes.io/instance: kgateway
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kgateway
      containers:
        - name: controller
          image: "cr.kgateway.dev/kgateway-dev/kgateway:v2.3.1"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9977
              name: grpc-xds
              protocol: TCP
            - containerPort: 9093
              name: health
              protocol: TCP
            - containerPort: 9092
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9093
            initialDelaySeconds: 1
            periodSeconds: 10
          startupProbe:
            failureThreshold: 600
            httpGet:
              path: /readyz
              port: 9093
            initialDelaySeconds: 0
            periodSeconds: 1
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  divisor: "1"
                  resource: limits.memory
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  divisor: "1"
                  resource: limits.cpu
            - name: KGW_LOG_LEVEL
              value: "info"
            - name: KGW_XDS_SERVICE_NAME
              value: kgateway
            - name: KGW_XDS_SERVICE_PORT
              value: "9977"
            - name: KGW_DEFAULT_IMAGE_REGISTRY
              value: cr.kgateway.dev/kgateway-dev
            - name: KGW_DEFAULT_IMAGE_TAG
              value: v2.3.1
            - name: KGW_DEFAULT_IMAGE_PULL_POLICY
              value: IfNotPresent
            - name: KGW_DISCOVERY_NAMESPACE_SELECTORS
              value: "[]"
            - name: KGW_POLICY_MERGE
              value: "{}"
            - name: KGW_VALIDATION_MODE
              value: "standard"
            - name: KGW_ENABLE_ENVOY
              value: "true"
            - name: KGW_GATEWAY_CLASS_PARAMETERS_REFS
              value: "{}"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {}