# Source: openchoreo-data-plane/charts/openchoreo-data-plane/templates/gateway/httplistenerpolicy.yaml
# NOTE: Existing users who previously applied a manual HTTPListenerPolicy named 'default-httplistenerpolicy'
# should delete it before upgrading to this chart version to avoid collision:
# `kubectl delete httplistenerpolicy default-httplistenerpolicy -n openchoreo-data-plane`
apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: openchoreo-data-plane-httplistenerpolicy
  namespace: openchoreo-data-plane
  labels:
    helm.sh/chart: openchoreo-data-plane-1.2.5
    app.kubernetes.io/name: openchoreo-data-plane
    app.kubernetes.io/instance: openchoreo-data-plane
    app.kubernetes.io/version: "v1.2.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: openchoreo
    app.kubernetes.io/component: gateway
spec:
  # Target the default gateway created by this chart
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-default
  # Enable WebSocket upgrades by default on all listeners of the target Gateway
  upgradeConfig:
    enabledUpgrades:
      - websocket