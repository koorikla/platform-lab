# Source: openchoreo-data-plane/charts/openchoreo-data-plane/templates/cluster-agent/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-agent-dataplane-tls
  namespace: openchoreo-data-plane
  labels:
    helm.sh/chart: openchoreo-data-plane-1.2.5
    app.kubernetes.io/name: openchoreo-data-plane
    app.kubernetes.io/instance: openchoreo-data-plane
    app.kubernetes.io/version: "v1.2.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: openchoreo
    app.kubernetes.io/component: cluster-agent
spec:
  secretName: cluster-agent-selfsigned-unused
  commonName: $(PLANE_ID)
  subject:
    organizations:
      - OpenChoreo
  isCA: false
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - client auth
  issuerRef:
    kind: Issuer
    name: cluster-agent-dataplane-selfsigned-issuer
  duration: 2160h
  renewBefore: 360h