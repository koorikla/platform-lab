# Source: openchoreo-data-plane/charts/openchoreo-data-plane/templates/cluster-agent/clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-agent-dataplane-openchoreo-data-plane
  labels:
    helm.sh/chart: openchoreo-data-plane-1.2.5
    app.kubernetes.io/name: openchoreo-data-plane
    app.kubernetes.io/instance: openchoreo-data-plane
    app.kubernetes.io/version: "v1.2.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: openchoreo
    app.kubernetes.io/component: cluster-agent
rules:
# Core Kubernetes workload resources
- apiGroups: ["apps"]
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs: ["*"]
# Deployment scale subresource (required for kubectl scale)
- apiGroups: ["apps"]
  resources:
  - deployments/scale
  - statefulsets/scale
  - replicasets/scale
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources:
  - pods
  - services
  - configmaps
  - secrets
  - persistentvolumeclaims
  - serviceaccounts
  - namespaces
  - endpoints
  verbs: ["*"]
- apiGroups: [""]
  resources:
  - pods/log
  - pods/status
  - events
  verbs: ["get", "list"]
# Pod exec (required for occ component exec / interactive shell into pods)
- apiGroups: [""]
  resources:
  - pods/exec
  verbs: ["create", "get"]
# Batch jobs
- apiGroups: ["batch"]
  resources:
  - jobs
  - cronjobs
  verbs: ["*"]
# Networking
- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  - networkpolicies
  verbs: ["*"]
# RBAC (for service account management)
- apiGroups: ["rbac.authorization.k8s.io"]
  resources:
  - roles
  - rolebindings
  - clusterroles
  - clusterrolebindings
  verbs: ["*"]
# Autoscaling
- apiGroups: ["autoscaling"]
  resources:
  - horizontalpodautoscalers
  verbs: ["*"]
# Policy
- apiGroups: ["policy"]
  resources:
  - poddisruptionbudgets
  verbs: ["*"]
# Cilium network policies (if using Cilium)
- apiGroups: ["cilium.io"]
  resources:
  - ciliumnetworkpolicies
  - ciliumclusterwidenetworkpolicies
  verbs: ["*"]
# Gateway API resources (if using Gateway API)
- apiGroups: ["gateway.networking.k8s.io"]
  resources:
  - gateways
  - httproutes
  - tcproutes
  - grpcroutes
  - tlsroutes
  - referencegrants
  verbs: ["*"]
# External Secrets Operator
- apiGroups: ["external-secrets.io"]
  resources:
  - externalsecrets
  - secretstores
  - clustersecretstores
  - pushsecrets
  verbs: ["*"]
# External Secrets Operator generators
- apiGroups: ["generators.external-secrets.io"]
  resources:
  - passwords
  verbs: ["*"]
# KGateway resources (if using KGateway)
- apiGroups: ["gateway.kgateway.dev"]
  resources:
  - backends
  - gatewayparameters
  - trafficpolicies
  verbs: ["*"]