suite: fleet labels (platform.lab/*) on the CAPI Cluster and the Argo cluster secret
templates:
  - cluster.yaml
  - argocd-identity.yaml
values:
  - values/dev1.yaml
tests:
  - it: defaults the ring to stable
    template: cluster.yaml
    asserts:
      - equal: { path: 'metadata.labels["platform.lab/ring"]', value: stable }

  - it: stamps ring canary on the Cluster
    template: cluster.yaml
    set: { ring: canary }
    asserts:
      - equal: { path: 'metadata.labels["platform.lab/ring"]', value: canary }

  - it: stamps ring canary on the Argo cluster secret (what worker-addons selects the branch by)
    template: argocd-identity.yaml
    documentSelector: { path: metadata.name, value: cluster-dev1 }
    set: { ring: canary }
    asserts:
      - equal: { path: 'spec.target.template.metadata.labels["platform.lab/ring"]', value: canary }
