# Filled from repos/platform-config/fleet/clusters/<env>/<name>.yaml
name: ""                       # cluster name == argocd-agent name == Argo CD destination name
env: ""                        # dev | test | prod
role: worker                   # worker | management (the self-hosted hub, see fleet/clusters/mgmt)
provider: docker
region: local
ring: stable                   # stable | canary — canary clusters follow rendered/<env>-canary
extraLabels: {}                # extra platform.lab/* style selectors, stamped on CAPI Cluster AND Argo cluster secret

fleetNamespace: fleet
argocdNamespace: argocd

clusterClass: k3s-docker
kubernetesVersion: v1.34.11+k3s1
controlPlaneReplicas: 1        # null for a managed control plane (EKS): the Cluster then sets no replicas
workerReplicas: 1
workerClass: k3s-default-worker   # a machineDeployments class of the ClusterClass (eks: default-worker)
variables:                     # ClusterClass variables, provider specific
  - name: kindImageVersion
    value: v1.34.0
network:                       # k3s defaults; the k3s provider does not derive them from the Cluster
  pods: 10.42.0.0/16
  services: 10.43.0.0/16

resourceProxy: argocd-agent-resource-proxy:9090
inClusterStore:                # owned by platform-charts/argocd-agent-principal; we only grant its SA our client cert
  name: in-cluster
  serviceAccount: eso-in-cluster

openbao:                       # platform-charts/openbao on the hub
  store: openbao                # ClusterSecretStore the hub writes with; workers pull secret/clusters/<name>/*
  namespace: openbao
  caProjector: fleet-ca-projector   # SA + SecretStore that project <name>-ca's public cert for fleet-sync
  caStore: fleet-ca

# OpenChoreo registration (templates/openchoreo.yaml): rendered for workers whenever the hub serves the OpenChoreo CRDs,
# i.e. while addons/management/openchoreo-control-plane is enabled. Names must match that umbrella chart.
openchoreo:
  orgNamespace: default        # Environments: the namespace the umbrella labels openchoreo.dev/control-plane=true
  namespace: openchoreo-control-plane   # agent CA + client cert, next to the cluster-gateway that trusts them
  gatewayCASecret: cluster-gateway-ca   # the cluster-gateway's server CA (upstream chart); only ca.crt is pushed
  appsDomain: apps.lab.localhost        # external endpoints: <env>-<namespace>.<name>.<appsDomain> (Phase 3)
  dataPlaneGateway:            # openchoreo-data-plane chart on the worker: Gateway gateway-default, listener http :80
    name: gateway-default
    namespace: openchoreo-data-plane
