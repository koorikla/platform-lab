{{- if eq .Values.role "worker" }}
{{- $n := .Values.name }}
{{- $ob := .Values.openbao }}
# Worker API CA for OpenBao auth/k8s-<name> (fleet-sync CronJob, platform-charts/openbao). The fleet-sync SA may not
# read the fleet namespace; instead the CA projector gets `get` on exactly CAPI's <name>-ca and ESO copies its
# public cert (never tls.key) to <name>-ca-public in the OpenBao namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $n }}-ca-projector
  namespace: {{ .Values.fleetNamespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $n }}-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $n }}-ca-projector
  namespace: {{ .Values.fleetNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $n }}-ca-projector }
subjects:
  - { kind: ServiceAccount, name: {{ $ob.caProjector }}, namespace: {{ $ob.namespace }} }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $n }}-ca-public
  namespace: {{ $ob.namespace }}
spec:
  # A reborn cluster gets a new <name>-ca; fleet-sync (every 2m) copies this projection into auth/k8s-<name> as is,
  # so a stale copy locks the new worker's ESO out (birth kit `wait` times out). 1m = one small in-cluster GET per
  # worker. Periodic (the default) is the only refreshPolicy that re-reads the source: OnChange reacts to changes of
  # this ExternalSecret's spec/metadata only, CreatedOnce never updates.
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: {{ $ob.caStore }} }
  target:
    name: {{ $n }}-ca-public
  data:
    - { secretKey: ca.crt, remoteRef: { key: {{ $n }}-ca, property: tls.crt } }
---
# ... and fleet-sync may `get` exactly that projection (#30): the OpenBao namespace also holds the unseal key and other
# generated sources. Same pattern as eso-in-cluster-<name> in argocd-identity.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-sync-{{ $n }}
  namespace: {{ $ob.namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $n }}-ca-public]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-sync-{{ $n }}
  namespace: {{ $ob.namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-sync-{{ $n }} }
subjects:
  - { kind: ServiceAccount, name: {{ $ob.fleetSync }}, namespace: {{ $ob.namespace }} }
{{- end }}
