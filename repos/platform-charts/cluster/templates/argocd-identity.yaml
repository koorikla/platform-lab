{{- if eq .Values.role "worker" }}
{{- $n := .Values.name -}}
{{- $tls := printf "%s-agent-client-tls" $n -}}
# 1. Client cert for the agent (CN = agent name). Signed by the hub CA from the argocd-agent-principal chart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $tls }}
  namespace: {{ .Values.argocdNamespace }}
spec:
  secretName: {{ $tls }}
  commonName: {{ $n }}
  usages: [client auth]
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: argocd-agent-ca, kind: Issuer }
---
# 2. The hub's SecretStore argocd/in-cluster may read exactly this cert, nothing else in argocd (CA key, JWT key...).
#    Store + SA are owned by platform-charts/argocd-agent-principal (templates/eso-in-cluster-store.yaml): the binding
#    refers to its SA by name (values: inClusterStore) -> keep both in step.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-in-cluster-{{ $n }}
  namespace: {{ .Values.argocdNamespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $tls }}]
    verbs: [get]              # ESO reads a remoteRef with a single GET
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-in-cluster-{{ $n }}
  namespace: {{ .Values.argocdNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-in-cluster-{{ $n }} }
subjects:
  - { kind: ServiceAccount, name: {{ .Values.inClusterStore.serviceAccount }}, namespace: {{ .Values.argocdNamespace }} }
---
# 3. Argo CD cluster secret, rendered from that cert. Same shape as `argocd-agentctl agent create`, but declarative
#    and carrying the fleet labels -> this is what ApplicationSet cluster generators select on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-{{ $n }}
  namespace: {{ .Values.argocdNamespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: {{ .Values.inClusterStore.name }} }
  target:
    name: cluster-{{ $n }}
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          argocd-agent.argoproj-labs.io/agent-name: {{ $n }}
          {{- include "cluster.labels" . | nindent 10 }}
        annotations:
          argocd.argoproj.io/skip-reconcile: "true"   # hub app-controller must not reconcile agent clusters (Argo CD >= 3.4)
      data:
        name: {{ $n }}
        server: "https://{{ .Values.resourceProxy }}?agentName={{ $n }}"
        config: |
          {"tlsClientConfig":{"insecure":false,"certData":"{{ `{{ .crt | b64enc }}` }}","keyData":"{{ `{{ .key | b64enc }}` }}","caData":"{{ `{{ .ca | b64enc }}` }}"}}
  data:
    - { secretKey: crt, remoteRef: { key: {{ $tls }}, property: tls.crt } }
    - { secretKey: key, remoteRef: { key: {{ $tls }}, property: tls.key } }
    - { secretKey: ca,  remoteRef: { key: {{ $tls }}, property: ca.crt } }
---
# 4. Cert + CA to OpenBao (secret/clusters/<name>/argocd-agent). Pull model: the worker's ESO (CAAPH birth kit,
#    fleet/base/helmchartproxies.yaml) reads only its own path and materialises argocd-agent-client-tls (tls) and
#    argocd-agent-ca (ca.crt only). Nothing on the hub writes into the worker.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $n }}-argocd-agent
  namespace: {{ .Values.argocdNamespace }}
spec:
  refreshInterval: 1m           # OpenBao runs in dev mode (in-memory): refills it quickly after a restart
  updatePolicy: Replace
  deletionPolicy: Delete        # cluster file removed -> its material leaves OpenBao too
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: {{ .Values.openbao.store }} }
  selector:
    secret:
      name: {{ $tls }}
  data:
    {{- range list "tls.crt" "tls.key" "ca.crt" }}
    - match: { secretKey: {{ . }}, remoteRef: { remoteKey: clusters/{{ $n }}/argocd-agent, property: {{ . }} } }
    {{- end }}
{{- end }}
