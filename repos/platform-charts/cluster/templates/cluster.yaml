apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.fleetNamespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  clusterNetwork:
    serviceDomain: cluster.local
    pods:
      cidrBlocks: [{{ .Values.network.pods }}]
    services:
      cidrBlocks: [{{ .Values.network.services }}]
  topology:
    class: {{ .Values.clusterClass }}
    version: {{ .Values.kubernetesVersion }}
    controlPlane:
      replicas: {{ .Values.controlPlaneReplicas }}
    {{- with .Values.variables }}
    variables:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    workers:
      machineDeployments:
        - class: {{ .Values.workerClass }}
          name: md-0
          replicas: {{ .Values.workerReplicas }}
