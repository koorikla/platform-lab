apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.fleetNamespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
  {{- if eq .Values.role "management" }}
  annotations:
    # the hub's own Cluster object: Argo CD must never delete it (that would tear down the cluster Argo runs in)
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  {{- end }}
spec:
  clusterNetwork:
    serviceDomain: cluster.local
    pods:
      cidrBlocks: [{{ .Values.network.pods }}]
    services:
      cidrBlocks: [{{ .Values.network.services }}]
  topology:
    class: {{ .Values.clusterClass }}
    version: {{ .Values.kubernetesVersion }}
    {{- if kindIs "invalid" .Values.controlPlaneReplicas }}
    controlPlane: {}             # managed control plane (EKS): no replicas
    {{- else }}
    controlPlane:
      replicas: {{ .Values.controlPlaneReplicas }}
    {{- end }}
    {{- with .Values.variables }}
    variables:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    workers:
      machineDeployments:
        - class: {{ .Values.workerClass }}
          name: md-0
          replicas: {{ .Values.workerReplicas }}
