# Hub profile defaults. Release name MUST be "argocd" (bootstrap + mgmt-argo-cd app), so services are argocd-*.
argo-cd:
  fullnameOverride: argocd
  global:
    domain: localhost
  configs:
    params:
      server.insecure: true
      controller.diff.server.side: true   # CRD defaults (ESO, CAPI) otherwise show as permanent drift
      # ~30 hub Applications on a Docker VM shared with every cluster (#76): the controller was the hub's biggest CPU
      # consumer during bursts. Half the default processors (20/10) still refresh every app within a few rounds and
      # cap how much of a refresh/sync wave runs at once.
      controller.status.processors: 10
      controller.operation.processors: 5
    cm:
      # Periodic refresh (git ls-remote + manifest compare per app) every 5-6 min instead of 2-3 min (chart default
      # 120s + 60s jitter). Changes on main reach the hub up to 6 min later: refresh the app to go faster. Worker apps
      # are unaffected (their Argo CD polls, see worker-birth-kit).
      timeout.reconciliation: 300s
      timeout.reconciliation.jitter: 60s
      # Built-in PVC health + one exception: a Pending PVC that is a Helm hook (Argo: PreSync) counts as Healthy.
      # Thunder's sqlite PVC is a pre-install hook, the hub StorageClass (local-path) binds on first consumer, and that
      # consumer is a later hook (the setup Job): with Pending = Progressing the sync would wait forever.
      # Core kinds take no "<group>_" prefix. Evaluated by hack/tests/test_argocd_pvc_health.sh (argocd CLI).
      resource.customizations.health.PersistentVolumeClaim: |
        hs = {}
        local phase = obj.status and obj.status.phase or "Pending"
        if phase == "Bound" then hs.status = "Healthy"; hs.message = "Bound"; return hs end
        if phase == "Lost" then hs.status = "Degraded"; hs.message = "Lost"; return hs end
        if obj.metadata.annotations ~= nil and obj.metadata.annotations["helm.sh/hook"] ~= nil then
          hs.status = "Healthy"; hs.message = "Pending until first consumer (Helm hook)"; return hs
        end
        hs.status = "Progressing"; hs.message = "Pending"; return hs
  server:
    service:
      type: NodePort
      nodePortHttp: 30080
      nodePortHttps: 30082       # pinned: a random pick can steal 30443 from the argocd-agent principal
  dex:
    enabled: false
  notifications:
    enabled: false
  # argo-helm's default NetworkPolicy only lets Argo's own components reach redis; the principal needs it too
  extraObjects:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: argocd-redis-allow-agent-principal }
      spec:
        podSelector: { matchLabels: { app.kubernetes.io/name: argocd-redis } }
        policyTypes: [Ingress]
        ingress:
          - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: argocd-agent-principal } } }]
            ports: [{ port: 6379, protocol: TCP }]
