suite: Kargo admin account (#21) - password hash and signing key generated once in-cluster, not in git
release:
  name: kargo
  namespace: kargo
templates:
  - templates/admin-secret.yaml
  - charts/kargo/templates/api/secret.yaml
  - charts/kargo/templates/api/deployment.yaml
  - charts/kargo/templates/api/configmap.yaml
tests:
  - it: renders no chart Secret kargo-api (no hash or key literal to put in it)
    template: charts/kargo/templates/api/secret.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: loads the admin env from the generated Secret kargo-api-admin
    template: charts/kargo/templates/api/deployment.yaml
    asserts:
      - equal: { path: metadata.name, value: kargo-api }
      - equal: { path: 'spec.template.spec.containers[?(@.name == "api")].envFrom[?(@.secretRef)].secretRef.name', value: kargo-api-admin }

  # safe to paste into a shell or a login form
  - it: generates two independent 32+ character values without symbols
    template: templates/admin-secret.yaml
    documentSelector: { path: kind, value: Password }
    asserts:
      - isAPIVersion: { of: generators.external-secrets.io/v1alpha1 }
      - equal: { path: spec.secretKeys, value: [password, signingKey] }
      - greaterOrEqual: { path: spec.length, value: 32 }
      - equal: { path: spec.symbols, value: 0 }

  # a refresh must never rotate the password under a running kargo-api
  - it: generates the Secret once, with the env var names kargo-api expects
    template: templates/admin-secret.yaml
    documentSelector: { path: kind, value: ExternalSecret }
    asserts:
      - equal: { path: spec.target.name, value: kargo-api-admin }
      - equal: { path: spec.refreshPolicy, value: CreatedOnce }
      - equal:
          path: 'spec.dataFrom[0].sourceRef.generatorRef'
          value: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: kargo-admin }
      # ESO templates survive helm's own templating; adminPassword is what `make kargo-password` reads back
      - equal:
          path: spec.target.template
          value:
            engineVersion: v2
            data:
              ADMIN_ACCOUNT_PASSWORD_HASH: "{{ .password | bcrypt }}"
              ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: "{{ .signingKey }}"
              adminPassword: "{{ .password }}"
