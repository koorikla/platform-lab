kargo:
  api:
    host: localhost:8091   # `make ui` port-forward; 8080 is the OpenChoreo gateway
    tls:
      enabled: false
    service:
      type: NodePort
      nodePort: 30081
    # Admin password hash + token signing key are generated in-cluster (templates/admin-secret.yaml), never in git.
    # Setting this stops the chart from rendering its own kargo-api Secret (and requiring adminAccount.* values).
    secret:
      name: kargo-api-admin
  controller:
    argocd:
      namespace: argocd
# Controller only: it runs Kargo's AnalysisRuns (see Chart.yaml). No Rollout objects on the hub, so no dashboard.
argo-rollouts:
  installCRDs: true
  # Argo must never delete these CRDs (e.g. app removal/rename): that would cascade-delete every AnalysisRun/Template.
  crdAnnotations:
    argocd.argoproj.io/sync-options: Delete=false
  controller:
    replicas: 1   # lab: leader election means a 2nd replica only idles
  dashboard:
    enabled: false
