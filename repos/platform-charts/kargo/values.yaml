kargo:
  api:
    host: localhost:8081
    tls:
      enabled: false
    service:
      type: NodePort
      nodePort: 30081
    adminAccount:
      # LAB ONLY: password "admin". TODO: move to ESO-managed secret (api.secret.name).
      passwordHash: "$2b$10$48SEYFyqMQ5DVXCuMiOFv.HAAiaroOvGVx5/Op8l.mtP8jDqqFq/O"
      tokenSigningKey: "lab-only-change-me"
  controller:
    argocd:
      namespace: argocd
# Controller only: it runs Kargo's AnalysisRuns (see Chart.yaml). No Rollout objects on the hub, so no dashboard.
argo-rollouts:
  installCRDs: true
  # Argo must never delete these CRDs (e.g. app removal/rename): that would cascade-delete every AnalysisRun/Template.
  crdAnnotations:
    argocd.argoproj.io/sync-options: Delete=false
  controller:
    replicas: 1   # lab: leader election means a 2nd replica only idles
  dashboard:
    enabled: false
