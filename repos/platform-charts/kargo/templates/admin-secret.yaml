# Kargo admin account credentials, generated in-cluster by ESO: nothing sensitive lives in git.
# Two independent random values (password, token signing key); no symbols so the password pastes cleanly anywhere.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kargo-admin
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys: [password, signingKey]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-api-admin
spec:
  # Generate once: a refresh would mint a new password (and signing key) under a running kargo-api, which only reads
  # its env at startup. ESO still regenerates BOTH whenever the target is invalid:
  #   - Secret deleted (the rotation procedure; then `kubectl -n kargo rollout restart deploy/kargo-api`)
  #   - label reconcile.external-secrets.io/managed removed, or data-hash annotation mismatch (kubectl edit, added key)
  #   - this ExternalSecret deleted -> Secret garbage-collected (Owner): app cascade-delete/recreate, rename, move
  # Until kargo-api restarts it keeps the old env, so `make kargo-password` briefly shows a password that fails.
  # CreatedOnce also ignores later spec changes: after editing target.template below (e.g. keys for a Kargo upgrade)
  # delete the Secret, or the change never lands.
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.kargo.api.secret.name }}   # loaded into kargo-api with envFrom
    template:
      engineVersion: v2
      data:
        ADMIN_ACCOUNT_PASSWORD_HASH: {{ `'{{ .password | bcrypt }}'` }}   # sprig bcrypt, cost 10
        ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: {{ `'{{ .signingKey }}'` }}
        # Plaintext for the operator (`make kargo-password`). envFrom also puts it into kargo-api's environment; that
        # grants nothing extra: the same process already holds the signing key, which can mint admin tokens.
        adminPassword: {{ `'{{ .password }}'` }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kargo-admin
