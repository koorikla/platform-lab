hub:
  host: mgmt-lb                # DNS name workers dial: the hub's CAPD load balancer container (fleet/base/hub-lb.yaml)
  principalNodePort: 30443

argocd-agent-principal:
  fullnameOverride: argocd-agent-principal
  image:                       # chart appVersion still says v0.8.1; releases are published on quay only
    repository: quay.io/argoprojlabs/argocd-agent
    tag: v0.10.0
  # The chart has no config checksum and the principal reads its JWT key at startup only: this value is the roll
  # trigger. To rotate the key from git: delete Secret argocd-agent-jwt-key (cert-manager mints a new key, ESO copies
  # it within refreshInterval), then bump a suffix here (secret/argocd-agent-jwt@2, @3, ...). Agents re-auth via mTLS.
  # RollingUpdate with 1 replica keeps the old pod serving until the new one has loaded the key.
  podAnnotations:
    platform.lab/jwt-key: secret/argocd-agent-jwt
  service:
    type: ClusterIP            # exposed via templates/nodeport.yaml (chart has no nodePort knob)
  principal:
    listen:
      host: ""                 # chart default is 127.0.0.1 -> unreachable for remote agents
    auth: "mtls:CN=([^,]+)"    # agent name == client cert CN == CAPI cluster name
    destinationBasedMapping: true
    labelSelector: "argocd-agent=true"   # hybrid mode: only labelled Applications/AppProjects go to agents
    tls:
      clientCert:
        require: true
        matchSubject: true
    jwt:
      allowGenerate: false     # key comes from templates/jwt-key.yaml (cert-manager RSA PKCS#8 -> ESO); stable across restarts
      secretName: argocd-agent-jwt
