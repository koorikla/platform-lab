# OpenBao on the hub: the pull-model secret store. The hub writes per-cluster material to secret/clusters/<name>/*
# (PushSecrets through ClusterSecretStore `openbao`), each worker's ESO reads only its own path (auth/k8s-<name>).
#
# LAB MODE: dev server = in-memory, unsealed, plain HTTP, root token generated per start (never in git; only the pod's
# ~/.vault-token has it: `kubectl -n openbao exec openbao-0 -- bao ...`). A restart wipes everything; postStart re-seeds
# the hub config, fleet-sync re-creates the per-cluster auth mounts (<= 2 min) and PushSecrets refill the KV
# (refreshInterval). Prod path: server.standalone/ha with raft on a PVC (server.dataStorage), auto-unseal (transit or
# a cloud KMS seal stanza), TLS from cert-manager (global.tlsDisable=false + server.extraVolumes), and no NodePort
# (workers reach it through an ingress/gateway with a real hostname).
openbao:
  injector:
    enabled: false
  ui:
    enabled: false
  server:
    dev:
      enabled: true
      devRootToken: ""            # empty -> random per start (chart default is the literal "root")
    # chart default OnDelete suits manual unseal; dev mode re-seeds itself, so let config changes (postStart) roll
    updateStrategyType: RollingUpdate
    # chart Service stays ClusterIP (8200 + 8201 cluster port); workers get only 8200 via templates/nodeport.yaml
    # Hub-side config, re-applied on every start (dev mode forgets it). Names must match templates/*.yaml.
    postStart:
      - /bin/sh
      - -c
      - |
        set -e
        until bao status >/dev/null 2>&1; do sleep 1; done
        bao kv enable-versioning secret/ >/dev/null        # dev mode mounts kv v2 at secret/ already; no-op then
        bao auth list | grep -q '^kubernetes/' || bao auth enable kubernetes >/dev/null
        # the hub's own API; OpenBao reviews tokens with its pod SA (chart binds system:auth-delegator)
        bao write auth/kubernetes/config kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" >/dev/null
        bao policy write hub-writer - >/dev/null <<'EOP'
        path "secret/data/clusters/*"     { capabilities = ["create", "read", "update", "delete"] }
        path "secret/metadata/clusters/*" { capabilities = ["create", "read", "update", "delete", "list"] }
        EOP
        # fleet-sync can only create kubernetes mounts named k8s-*, point them at a worker API, and bind ONE role shape:
        # external-secrets/external-secrets -> a single cluster-* policy (plain strings only: OpenBao compares list
        # values as a whole, and "a,b" would pass the cluster-* glob -> commas/spaces denied). Residual risk: the body
        # of sys/policies/acl/cluster-* can't be constrained (allowed_parameters globs are prefix/suffix only), so this
        # role can still write a broad cluster-* policy and attach it to a k8s-* role. Treat openbao-fleet-sync as
        # sensitive; prod: a controller with a fixed policy template, or Sentinel/EGP-style checks. Its hub Role also
        # has `get` on every Secret in this namespace (names <cluster>-ca-public are dynamic), which includes the
        # generated openchoreo-* sources: nothing it couldn't already reach through the policy escalation above.
        bao policy write fleet-sync - >/dev/null <<'EOP'
        path "sys/auth"                   { capabilities = ["read", "sudo"] }
        path "sys/auth/k8s-*" {
          capabilities = ["create", "update", "delete", "sudo"]
          allowed_parameters = { "type" = ["kubernetes"], "description" = [] }
        }
        path "auth/k8s-*" {
          capabilities = ["create", "read", "update", "delete"]
          allowed_parameters = {
            "kubernetes_host" = [], "kubernetes_ca_cert" = [], "disable_local_ca_jwt" = [true],
            "bound_service_account_names" = ["external-secrets"], "bound_service_account_namespaces" = ["external-secrets"],
            "token_policies" = ["cluster-*"], "token_ttl" = []
          }
          denied_parameters = { "token_policies" = ["*,*", "* *"] }
        }
        path "sys/policies/acl"           { capabilities = ["list"] }
        path "sys/policies/acl/cluster-*" { capabilities = ["create", "read", "update", "delete"] }
        EOP
        bao write auth/kubernetes/role/hub-writer token_policies=hub-writer token_ttl=1h \
          bound_service_account_names=openbao-hub-writer bound_service_account_namespaces="$BAO_K8S_NAMESPACE" >/dev/null
        bao write auth/kubernetes/role/fleet-sync token_policies=fleet-sync token_ttl=10m \
          bound_service_account_names=openbao-fleet-sync bound_service_account_namespaces="$BAO_K8S_NAMESPACE" >/dev/null
        # OpenChoreo (templates/openchoreo.yaml): the seeder PushSecret writes secret/openchoreo/*, ClusterSecretStore
        # `default` only reads it. No KV values here: they are generated in-cluster and re-pushed after every restart.
        # No delete: the PushSecrets use deletionPolicy None (delete on metadata/ would destroy every version).
        bao policy write openchoreo-seeder - >/dev/null <<'EOP'
        path "secret/data/openchoreo/*"     { capabilities = ["create", "read", "update"] }
        path "secret/metadata/openchoreo/*" { capabilities = ["create", "read", "update"] }
        EOP
        bao policy write openchoreo-reader - >/dev/null <<'EOP'
        path "secret/data/openchoreo/*"     { capabilities = ["read"] }
        EOP
        bao write auth/kubernetes/role/openchoreo-seeder token_policies=openchoreo-seeder token_ttl=10m \
          bound_service_account_names=openbao-openchoreo-seeder bound_service_account_namespaces="$BAO_K8S_NAMESPACE" >/dev/null
        bao write auth/kubernetes/role/openchoreo-reader token_policies=openchoreo-reader token_ttl=1h \
          bound_service_account_names=openbao-openchoreo-reader bound_service_account_namespaces="$BAO_K8S_NAMESPACE" >/dev/null

# ClusterSecretStore `openbao` (hub-writer): only these namespaces may push through it
hubWriter:
  namespaces:
    - argocd                      # cluster chart: PushSecret <name>-argocd-agent
    - openchoreo-control-plane    # cluster chart: PushSecrets <name>-openchoreo-agent, <name>-openchoreo-gateway-ca

# OpenChoreo secrets (templates/openchoreo.yaml): each key generated once in-cluster, kept in Secret
# openbao/openchoreo-<key> (key `value`) and pushed to secret/openchoreo/<key> (property `value`);
# ClusterSecretStore `default` serves them read-only.
openchoreo:
  # upstream key names (install/k3d/common/values-openbao.yaml @ v1.2.5) minus the optional github-* placeholders.
  # One generator/Secret/PushSecret per key: adding a key generates only that one; rotating one (delete its Secret)
  # leaves the others alone. Regeneration triggers: templates/openchoreo.yaml header.
  generated: [backstage-backend-secret, backstage-client-secret, backstage-jenkins-api-key]
  # namespaces allowed to use ClusterSecretStore `default`:
  # - openchoreo-control-plane: ExternalSecret backstage-secrets (openchoreo-control-plane umbrella chart)
  # - thunder (#10 contract): Backstage's OAuth client secret is ONE value, owned here. Thunder reads
  #   secret/openchoreo/backstage-client-secret (property value) through this store and registers its Backstage app
  #   with it; Backstage gets the same value as backstage-secrets/client-secret. The store is per-namespace, not
  #   per-key, so thunder can read the other openchoreo/* keys too (lab-acceptable: the IdP holds every client secret).
  namespaces: [openchoreo-control-plane, thunder]

# API for workers: http://mgmt-lb:30820 (fleet/base/hub-lb.yaml frontend -> this NodePort)
nodePort: 30820

# fleet-sync: per worker cluster, auth/k8s-<name> + role eso + policy cluster-<name>
fleetSync:
  schedule: "*/2 * * * *"
  # kubectl + curl + jq + bash; tag follows the fleet's Kubernetes minor, digest = multi-arch index of that tag
  image: alpine/k8s:1.34.11@sha256:0382123ab8ae17d8da5d43cc299242933eb012cfbe56787b43731c942c3eed80
  fleetNamespace: fleet           # reads only CAPI Clusters there (endpoint); CAs come from <name>-ca-public below
  caProjector: fleet-ca-projector # SA + SecretStore fleet-ca: the cluster chart grants it get on <name>-ca only
  workerSelector: platform.lab/role=worker
  # the worker's ESO (CAAPH birth kit, fleet/base/helmchartproxies.yaml worker-external-secrets)
  esoServiceAccount: external-secrets
  esoNamespace: external-secrets
  tokenTTL: 1h
