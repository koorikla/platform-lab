# OpenChoreo's secrets (#9). Upstream seeds literals in postStart (values-openbao.yaml); here nothing is in git:
#   Password generator -> Secret openchoreo-generated (generated ONCE, the source of truth: OpenBao dev mode is
#   in-memory) -> PushSecret -> secret/openchoreo/<key> (property `value`) -> ClusterSecretStore `default` (read-only)
#   -> ExternalSecrets in the OpenChoreo namespaces (backstage-secrets: openchoreo-control-plane umbrella chart).
# Roles/policies `openchoreo-seeder` / `openchoreo-reader`: server.postStart (values.yaml).
# Rotate a value: delete Secret openbao/openchoreo-generated; ESO regenerates all keys, the PushSecret overwrites
# OpenBao within a minute, consumers pick it up on their refresh (then restart backstage; Thunder must re-seed its
# Backstage app with the new client secret).
{{- $oc := .Values.openchoreo }}
{{- $addr := printf "http://%s.%s.svc:8200" .Release.Name .Release.Namespace }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: openchoreo-generated
  namespace: {{ .Release.Namespace }}
spec:
  length: 32
  digits: 6
  symbols: 0                      # client-secret goes into OAuth forms, headers and JSON verbatim
  noUpper: false
  allowRepeat: true
  secretKeys: {{ toYaml $oc.generated | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openchoreo-generated
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce      # a refresh must never mint new values under running consumers
  target:
    name: openchoreo-generated
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: openchoreo-generated
---
# Seeder: may write secret/openchoreo/* only; namespaced store, so only this namespace can push through it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-openchoreo-seeder
  namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openchoreo-seeder
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: {{ $addr }}
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: openchoreo-seeder
          serviceAccountRef: { name: openbao-openchoreo-seeder }
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: openchoreo-generated
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1m             # dev mode forgets everything on restart: refill quickly
  updatePolicy: Replace
  # None: this PushSecret goes away together with OpenBao (same chart), a Delete finalizer would wait on a gone server
  deletionPolicy: None
  secretStoreRefs:
    - { kind: SecretStore, name: openchoreo-seeder }
  selector:
    secret:
      name: openchoreo-generated
  data:
    {{- range $oc.generated }}
    - match: { secretKey: {{ . }}, remoteRef: { remoteKey: openchoreo/{{ . }}, property: value } }
    {{- end }}
---
# `default`: the store name OpenChoreo's docs and samples use on the control plane. Read-only (upstream binds its
# writer role here because single-cluster installs also push from the workflow plane; OpenChoreo's own PushSecrets
# go through each plane's secretStoreRef, not this hub store).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-openchoreo-reader
  namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default
spec:
  conditions:
    - namespaces: {{ toYaml $oc.namespaces | nindent 8 }}
  provider:
    vault:
      server: {{ $addr }}
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: openchoreo-reader
          serviceAccountRef: { name: openbao-openchoreo-reader, namespace: {{ .Release.Namespace }} }
