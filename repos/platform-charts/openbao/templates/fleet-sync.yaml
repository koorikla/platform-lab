# fleet-sync: keeps one OpenBao kubernetes auth mount per worker cluster (auth/k8s-<name>) in line with the CAPI
# Clusters in the fleet namespace. Pull model: the worker's ESO logs in there with its own ServiceAccount and may read
# only secret/data/clusters/<name>/*. Script: files/fleet-sync.sh. Role/policy `fleet-sync`: files/configure.sh, templates/configure.yaml.
# A CronJob rather than a watch loop (#30): the reconcile is level-based and idempotent, and <= 2 min is well inside a
# worker's birth (its ESO retries); a controller would add a Deployment and watch code for no gain in correctness.
# Hub RBAC: list CAPI Clusters in fleet - nothing else here. `get` on exactly <name>-ca-public in this namespace comes
# per worker from the cluster chart (templates/openbao-ca.yaml): this namespace also holds openbao-unseal-key and the
# openchoreo-* sources, which fleet-sync must not read.
{{- $fs := .Values.fleetSync }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-fleet-sync
  namespace: {{ .Release.Namespace }}
---
# endpoint: CAPI Cluster .spec.controlPlaneEndpoint (no secrets in fleet are readable)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-fleet-sync
  namespace: {{ $fs.fleetNamespace }}
rules:
  - apiGroups: [cluster.x-k8s.io]
    resources: [clusters]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-fleet-sync
  namespace: {{ $fs.fleetNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: openbao-fleet-sync }
subjects:
  - { kind: ServiceAccount, name: openbao-fleet-sync, namespace: {{ .Release.Namespace }} }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-fleet-sync
  namespace: {{ .Release.Namespace }}
data:
  fleet-sync.sh: |
    {{- .Files.Get "files/fleet-sync.sh" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-fleet-sync
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ $fs.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0                 # the next run is the retry
      activeDeadlineSeconds: 100
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          annotations:
            checksum/script: {{ .Files.Get "files/fleet-sync.sh" | sha256sum }}
        spec:
          serviceAccountName: openbao-fleet-sync
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: fleet-sync
              image: {{ $fs.image }}
              command: [bash, /scripts/fleet-sync.sh]
              env:
                - { name: HOME, value: /tmp }   # kubectl cache; root fs is read-only
                - { name: BAO_ADDR, value: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc:8200" }
                - { name: FLEET_NS, value: {{ $fs.fleetNamespace | quote }} }
                - { name: CA_NS, value: {{ .Release.Namespace | quote }} }
                - { name: WORKER_SELECTOR, value: {{ $fs.workerSelector | quote }} }
                - { name: ESO_SA, value: {{ $fs.esoServiceAccount | quote }} }
                - { name: ESO_NS, value: {{ $fs.esoNamespace | quote }} }
                - { name: TOKEN_TTL, value: {{ $fs.tokenTTL | quote }} }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts:
                - { name: script, mountPath: /scripts }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: script
              configMap: { name: openbao-fleet-sync }
            - name: tmp
              emptyDir: {}
