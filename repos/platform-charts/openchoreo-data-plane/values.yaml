# Phase 2. Remote-plane settings per upstream multi-cluster guide.
openchoreo-data-plane:
  gateway:
    tls:
      enabled: false
  clusterAgent:
    enabled: true
    serverUrl: "wss://mgmt-lb:30843/ws"   # VERIFY: needs fixed nodePort + frontend in fleet/base/hub-lb.yaml
    tls:
      enabled: true
      generateCerts: true
      serverCAConfigMap: cluster-gateway-ca          # TODO: deliver declaratively (see CLAUDE.md -> OpenChoreo trust)
      caSecretName: ""
