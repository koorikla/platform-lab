suite: OpenChoreo data plane (#14) - cluster-agent without a cluster name, Reloader, Gateway, requests only for envoy
# Rendered like Kargo's render-addon (release/namespace from addon.yaml). The contract with the birth kit's identity
# objects (Secret cluster-agent-tls, ConfigMap cluster-gateway-ca) and the hub endpoint: hack/tests/test_openchoreo_data_plane.sh
release:
  name: openchoreo-data-plane
  namespace: openchoreo-data-plane
templates:
  - charts/openchoreo-data-plane/templates/cluster-agent/*.yaml
  - charts/openchoreo-data-plane/templates/gateway/*.yaml
  - charts/reloader/templates/*.yaml
  - templates/gatewayparameters.yaml
tests:
  # the plane ID is an env var from the identity Secret (kubelet expands $(VAR)); nothing cluster-specific in the render
  - it: runs the agent with TLS and a plane ID from its environment
    template: charts/openchoreo-data-plane/templates/cluster-agent/deployment.yaml
    asserts:
      - equal: { path: metadata.name, value: cluster-agent-dataplane }
      - contains: { path: 'spec.template.spec.containers[?(@.name == "agent")].args', content: '--plane-id=$(PLANE_ID)' }
      - contains: { path: 'spec.template.spec.containers[?(@.name == "agent")].args', content: --tls-enabled=true }
      - equal:
          path: 'spec.template.spec.containers[?(@.name == "agent")].env[?(@.name == "PLANE_ID")].valueFrom.secretKeyRef'
          value: { name: cluster-agent-tls, key: plane-id }
      - equal: { path: 'spec.template.spec.volumes[?(@.name == "client-certs")].secret.secretName', value: cluster-agent-tls }
      - equal: { path: 'spec.template.spec.volumes[?(@.name == "server-ca")].configMap.name', value: cluster-gateway-ca }

  # upstream cluster-agent loads its cert once at startup (agent.go:83)
  - it: restarts the agent when its identity Secret or the gateway CA changes
    template: charts/openchoreo-data-plane/templates/cluster-agent/deployment.yaml
    asserts:
      - equal: { path: 'spec.template.metadata.annotations["secret.reloader.stakater.com/reload"]', value: cluster-agent-tls }
      - equal: { path: 'spec.template.metadata.annotations["configmap.reloader.stakater.com/reload"]', value: cluster-gateway-ca }

  # a pod-template annotation, which Argo's diff ignores (not an env var); this namespace only
  - it: runs Reloader with the annotations strategy, watching only its own namespace
    template: charts/reloader/templates/deployment.yaml
    asserts:
      - contains: { path: 'spec.template.spec.containers[0].args', content: --reload-strategy=annotations }
      - equal:
          path: 'spec.template.spec.containers[0].env[?(@.name == "KUBERNETES_NAMESPACE")].valueFrom.fieldRef.fieldPath'
          value: metadata.namespace

  - it: gives Reloader no cluster-wide RBAC
    asserts:
      - hasDocuments: { count: 0 }
        template: charts/reloader/templates/clusterrole.yaml
      - hasDocuments: { count: 0 }
        template: charts/reloader/templates/clusterrolebinding.yaml

  # the chart renders a Certificate while TLS is on: it must not write into the Secret ESO owns
  - it: keeps the chart's own agent Certificate away from the identity Secret
    template: charts/openchoreo-data-plane/templates/cluster-agent/certificate.yaml
    asserts:
      - equal: { path: metadata.name, value: cluster-agent-dataplane-tls }
      - notEqual: { path: spec.secretName, value: cluster-agent-tls }

  # #76: the Docker VM is CPU-bound - small requests and bounded limits
  - it: requests and limits cpu and memory for the agent and Reloader
    asserts:
      - exists: { path: 'spec.template.spec.containers[0].resources.requests.cpu' }
        template: charts/openchoreo-data-plane/templates/cluster-agent/deployment.yaml
      - exists: { path: 'spec.template.spec.containers[0].resources.requests.memory' }
        template: charts/openchoreo-data-plane/templates/cluster-agent/deployment.yaml
      - exists: { path: 'spec.template.spec.containers[0].resources.limits.cpu' }
        template: charts/openchoreo-data-plane/templates/cluster-agent/deployment.yaml
      - exists: { path: 'spec.template.spec.containers[0].resources.limits.memory' }
        template: charts/openchoreo-data-plane/templates/cluster-agent/deployment.yaml
      - exists: { path: 'spec.template.spec.containers[0].resources.requests.cpu' }
        template: charts/reloader/templates/deployment.yaml
      - exists: { path: 'spec.template.spec.containers[0].resources.requests.memory' }
        template: charts/reloader/templates/deployment.yaml
      - exists: { path: 'spec.template.spec.containers[0].resources.limits.cpu' }
        template: charts/reloader/templates/deployment.yaml
      - exists: { path: 'spec.template.spec.containers[0].resources.limits.memory' }
        template: charts/reloader/templates/deployment.yaml

  # the Gateway the ClusterDataPlane names (cluster chart: gateway-default, listener http :80), no TLS
  - it: serves apps through Gateway gateway-default on http:80, sized by its GatewayParameters
    template: charts/openchoreo-data-plane/templates/gateway/gateway.yaml
    asserts:
      - equal: { path: metadata.name, value: gateway-default }
      - equal: { path: 'spec.listeners[*].name', value: http }
      - equal: { path: 'spec.listeners[*].port', value: 80 }
      - equal: { path: spec.infrastructure.parametersRef, value: { group: gateway.kgateway.dev, kind: GatewayParameters, name: gateway-default } }
      # the chart's own infrastructure label survives the parametersRef merge
      - equal: { path: 'spec.infrastructure.labels["openchoreo.dev/system-component"]', value: gateway }

  # like the hub's: ClusterIP (no servicelb pod binding :80 on every worker node), sized envoy, requests only
  - it: keeps the Gateway's Service ClusterIP and sizes envoy with requests only
    template: templates/gatewayparameters.yaml
    asserts:
      - isAPIVersion: { of: gateway.kgateway.dev/v1alpha1 }
      - equal: { path: metadata.name, value: gateway-default }
      - equal: { path: metadata.namespace, value: openchoreo-data-plane }
      - equal: { path: spec.kube.service.type, value: ClusterIP }
      - exists: { path: spec.kube.envoyContainer.resources.requests.cpu }
      - exists: { path: spec.kube.envoyContainer.resources.requests.memory }
      - notExists: { path: spec.kube.envoyContainer.resources.limits }
