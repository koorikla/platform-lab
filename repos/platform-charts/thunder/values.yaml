      # lab (#19, research §G/§H): OIDC clients for Argo CD and Kargo, seeded now so #19 only flips their configs.
      # Public clients with PKCE -> no client secret exists anywhere. Redirect URIs follow `make ui` after #11
      # (Argo CD :8090, Kargo :8091). email + groups in the ID token: Kargo's usernameClaim is email, both map groups.
      62-argocd-app.sh: |
        #!/bin/bash
        set -e

        THUNDER_URL="http://localhost:8090"

        log_info "Checking if application 'Argo CD' already exists..."
