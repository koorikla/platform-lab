# Backstage's OAuth client secret (contract with #9): ONE value, generated in-cluster by the openbao chart
# (templates/openchoreo.yaml) and kept in OpenBao; Backstage reads the same key into backstage-secrets/client-secret.
# The setup Job (bootstrap script 51) registers Thunder's Backstage app with it via env (thunder.setup.env).
#
# The Job is a Helm pre-install hook = Argo PreSync (weight -5), so this must be one too, at a lower weight: Argo
# applies it first and waits until it is Healthy (ExternalSecret Ready = target Secret written) before the next wave.
# Not Ready (store/key missing, e.g. OpenBao just restarted) = Degraded -> sync fails, the appset retry runs it again.
# hook-failed (Argo: HookFailed) keeps it and its Secret across syncs; BeforeHookCreation would delete it every sync
# and race the Secret's garbage collection against the re-created ExternalSecret.
{{- with .Values.backstageClientSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: hook-failed
spec:
  refreshInterval: 1h             # rotation: new value lands here within 1h, Thunder re-registers on the next sync
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .store }} }
  target:
    name: {{ .secretName }}
  data:
    - secretKey: client-secret
      remoteRef: { key: {{ .remoteKey }}, property: value }
{{- end }}
