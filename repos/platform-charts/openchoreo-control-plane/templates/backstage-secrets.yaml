# Backstage's Secret (backstage.secretName) from OpenBao, like upstream install/k3d/k3d-install.sh @ v1.2.5, but with
# values generated in-cluster (platform-charts/openbao templates/openchoreo.yaml, KV prefix openchoreo/).
# Mandatory keys per templates/backstage/deployment.yaml of the upstream chart; github-* are optional and left out.
# client-secret == the Thunder Backstage app's client_secret (same OpenBao key, see openbao values `openchoreo`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ index .Values "openchoreo-control-plane" "backstage" "secretName" }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: default }
  target:
    name: {{ index .Values "openchoreo-control-plane" "backstage" "secretName" }}
  data:
    - { secretKey: backend-secret,  remoteRef: { key: openchoreo/backstage-backend-secret, property: value } }
    - { secretKey: client-secret,   remoteRef: { key: openchoreo/backstage-client-secret, property: value } }
    - { secretKey: jenkins-api-key, remoteRef: { key: openchoreo/backstage-jenkins-api-key, property: value } }
