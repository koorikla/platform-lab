suite: backstage-secrets (#9) - Backstage's mandatory secrets from OpenBao via ClusterSecretStore default
release:
  name: openchoreo-control-plane
  namespace: openchoreo-control-plane
templates:
  - templates/backstage-secrets.yaml
tests:
  # upstream templates/backstage/deployment.yaml reads all three (jenkins-api-key too, not optional)
  - it: renders the Secret Backstage mounts, from the keys the openbao chart generates
    asserts:
      - equal: { path: spec.target.name, value: backstage-secrets }
      - equal: { path: metadata.namespace, value: openchoreo-control-plane }
      - equal: { path: spec.secretStoreRef, value: { kind: ClusterSecretStore, name: default } }
      - equal:
          path: spec.data
          value:
            - { secretKey: backend-secret, remoteRef: { key: openchoreo/backstage-backend-secret, property: value } }
            - { secretKey: client-secret, remoteRef: { key: openchoreo/backstage-client-secret, property: value } }
            - { secretKey: jenkins-api-key, remoteRef: { key: openchoreo/backstage-jenkins-api-key, property: value } }
