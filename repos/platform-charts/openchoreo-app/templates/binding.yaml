{{- if eq .Values.mode "binding" }}
{{- include "oc.required" (list . "name" "project" "environment") }}
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: {{ .Values.name }}-{{ .Values.environment }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "oc.labels" . | nindent 4 }}
spec:
  owner: { projectName: {{ .Values.project }}, componentName: {{ .Values.name }} }
  environment: {{ .Values.environment }}
  releaseName: {{ if .Values.releaseName }}{{ .Values.releaseName }}{{ else }}{{ include "oc.releaseName" . }}{{ end }}
  {{- with .Values.environmentConfigs }}
  componentTypeEnvironmentConfigs: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.workloadOverrides }}
  workloadOverrides: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
