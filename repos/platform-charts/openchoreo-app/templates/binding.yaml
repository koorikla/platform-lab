{{- if eq .Values.mode "binding" }}
{{- include "oc.required" (list . "name" "project" "releaseName" "environment") }}
{{- include "oc.dns1123" (list . "name" "project" "environment") }}
# Identity only (owner, environment, release): env-specific config is frozen in the promoted release.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: {{ .Values.name }}-{{ .Values.environment }}
  namespace: {{ .Values.namespace }}
  labels:
    openchoreo.dev/project: {{ .Values.project }}
    openchoreo.dev/component: {{ .Values.name }}
    openchoreo.dev/environment: {{ .Values.environment }}
    platform.lab/app: {{ .Values.name }}
spec:
  owner: { projectName: {{ .Values.project }}, componentName: {{ .Values.name }} }
  environment: {{ .Values.environment }}
  releaseName: {{ .Values.releaseName }}
{{- end }}
