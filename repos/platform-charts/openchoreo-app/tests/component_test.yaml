suite: mode=component (hub, from main) - the Component only; releases are cut by Kargo, not by the controller
templates:
  - templates/component.yaml
values:
  - values/podinfo/app.yaml
set:
  mode: component
tests:
  - it: renders just the Component
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Component }
      - equal: { path: metadata.name, value: podinfo }
      - equal: { path: metadata.namespace, value: default }

  - it: never deploys on its own, owned by project lab, typed by the cluster-wide type
    asserts:
      - equal: { path: spec.autoDeploy, value: false }
      - equal: { path: spec.owner.projectName, value: lab }
      - equal: { path: spec.componentType, value: { kind: ClusterComponentType, name: deployment/service } }

  # same values, same place upstream puts them (the release freezes them as componentProfile.parameters)
  - it: passes parameters to Component.spec.parameters
    set: { parameters.foo: bar }
    asserts:
      - equal: { path: spec.parameters.foo, value: bar }
