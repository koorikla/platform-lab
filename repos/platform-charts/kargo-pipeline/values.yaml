# One Kargo pipeline (Project <kind>-<name>) for one addon or app; an ApplicationSet instantiates it per folder
# (kargo-addon-pipelines: addons/workers/*/addon.yaml; kargo-app-pipelines: repos/apps/*/app.yaml).
# Staged (travels with Freight): the chart and the addon's values; for apps the image tag, app.yaml, env values and the
# openchoreo-app chart. NOT staged: chart/namespace/releaseName/image/imageConstraint below come from addon.yaml or
# app.yaml on main and hit every stage at its next promotion - change them like a new addon/app, not a rollout.
kind: addon                 # addon (task render-addon) | app (task render-app); anything else fails the render
name: ""                    # required; == folder name under addons/workers/ or repos/apps/ (hack/lint.sh checks)
chart: ""                   # addon: chart folder under repos/platform-charts (default: name)
namespace: ""               # addon: target namespace (default: name)
releaseName: ""             # addon: helm release name (default: name)
image: ""                   # app (required): image repository (Warehouse subscription, render-app's imageFrom)
imageConstraint: ""         # app: semver constraint for new tags, e.g. ^6.0.0 (empty: highest semver)
repoURL: git@github.com:koorikla/platform-lab.git   # SSH: Kargo's credential is the repo deploy key; passed to the task
stages:                     # order = promotion order; the first stage takes Freight straight from the Warehouse
  - { name: dev-canary, env: dev,  pr: false }   # name = stage + rendered/<name> branch; env = values overlay
  - { name: dev,        env: dev,  pr: false }   # optional `soak: 15m`: minimum time in the previous stage (below)
  - { name: test,       env: test, pr: false }
  - { name: prod,       env: prod, pr: false }   # pr: true needs a token that can open PRs (deploy key can't)
# dev follows its canary ring automatically, but only with Freight that passed verification in dev-canary (below): the
# canary's Applications Synced + Healthy at the promoted commit for `consecutiveSuccesses` measurements in a row. A
# canary that doesn't get there within `count` measurements fails verification, and dev never takes that Freight.
# No soak by default: `soak` (Kargo requiredSoakTime) only adds a minimum dwell counted from the promotion, without
# looking at health; the worker Argo CD's <= 4 min repo poll plus the healthy streak already keep dev minutes behind.
# Skip the gate by approving the Freight for dev (a manual approval supersedes verification and soak). test and prod
# stay manual.
autoPromote: [dev-canary, dev]
# Apps (kind=app) render no verification: it reads an addon's worker Applications, and an app's releases have none
# until #17 binds them on the hub (app verification: #17/#18). Instead the stage fed by a canary stage (dev) takes
# only Freight that has been in that canary stage this long (requiredSoakTime; a stage's own `soak` wins).
appSoak: 15m
# Verification after every promotion, every stage (AnalysisTemplate argocd-apps; Argo Rollouts runs it in the project
# namespace). One measurement = one Job (files/verify-apps.sh) reading the hub Applications of this addon on the
# stage's clusters; a stage without clusters passes, except a canary stage (an empty ring must not open the gate).
# Gives up after count x (interval + Job runtime), ~11-12 min here. 60 s, not 30 s: every measurement is a Job + pod
# on the hub, and during a promotion wave that churn helped starve the hub control plane (#76).
verification:
  interval: 60s
  count: 10                 # measurements before giving up: covers the worker's <= 4 min repo poll + the rollout
  consecutiveSuccesses: 3   # healthy streak required (>= 2 min): a canary that flaps or crashes after start doesn't pass
  # kubectl + git + jq + bash; same pin as openbao fleetSync.image (Renovate group kubernetes; a test keeps them equal)
  image: alpine/k8s:1.34.11@sha256:0382123ab8ae17d8da5d43cc299242933eb012cfbe56787b43731c942c3eed80
  argocdNamespace: argocd   # where the worker-addons Applications live on the hub
  # what worker-addons syncs rendered/* from (https, anonymous: the Job only reads the branch's commit history)
  repoURL: https://github.com/koorikla/platform-lab.git
