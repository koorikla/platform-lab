{{- $p := include "kargo-pipeline.project" . }}
{{- range $i, $s := .Values.stages }}
{{- if $i }}
---
{{- end }}
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: {{ $s.name }}
  namespace: {{ $p }}
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: {{ $.Values.name }} }
      sources:
        {{- if eq $i 0 }}
        {{- if $s.soak }}{{ fail (printf "stages[0] (%s) takes Freight from the Warehouse: no upstream stage to soak in" $s.name) }}{{ end }}
        direct: true
        {{- else }}
        stages: [{{ (index $.Values.stages (sub $i 1)).name }}]
        {{- with $s.soak }}
        {{- if not (regexMatch "^([0-9]+(\\.[0-9]+)?(s|m|h))+$" (toString .)) }}
        {{- fail (printf "stages[].soak of %s: %v is not a duration like 15m or 1h30m (Kargo requiredSoakTime)" $s.name .) }}
        {{- end }}
        requiredSoakTime: {{ . | quote }}
        {{- end }}
        {{- end }}
  promotionTemplate:
    spec:
      steps:
        - task: { name: render-{{ $.Values.kind }}, kind: ClusterPromotionTask }
          as: render   # later steps read outputs.render.commit = SHA on rendered/<stage>
          vars:
            - { name: repoURL, value: {{ $.Values.repoURL | quote }} }
            {{- include (printf "kargo-pipeline.vars.%s" $.Values.kind) $ | nindent 12 }}
            - { name: env, value: {{ required "stages[].env is required" $s.env | quote }} }
            - { name: branch, value: {{ $s.name | quote }} }
            - { name: pr, value: {{ $s.pr | default false | toString | quote }} }
        # verification can read Stage metadata but not promotion outputs: record the commit it has to find.
        # quote() (here and in args below): Kargo turns an unquoted result that parses as a number (a SHA of digits
        # and one e) into a number.
        - uses: set-metadata
          config:
            updates:
              - kind: Stage
                name: {{ $s.name }}
                values:
                  renderedCommit: {{ `'${{ quote(outputs.render.commit) }}'` }}
  # Freight is verified here (and may move on) once this stage's Applications are Synced + Healthy at renderedCommit
  # for a streak of measurements (templates/verification.yaml). No Applications (no clusters in the stage) = passes.
  verification:
    analysisTemplates:
      - name: argocd-apps
    args:
      - { name: env, value: {{ $s.env | quote }} }
      - { name: ring, value: {{ include "kargo-pipeline.ring" $s }} }
      - { name: branch, value: {{ $s.name | quote }} }
      - { name: revision, value: {{ `'${{ quote(stageMetadata(ctx.stage)?.renderedCommit ?? "") }}'` }} }
{{- end }}
