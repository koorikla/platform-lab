# Rendered manifests pattern: helm-template the addon's umbrella chart at the Freight's commit with fleet + env values
# and commit plain YAML, one file per resource, to rendered/<branch>:addons/<addon>/. Workers sync that folder as a
# plain directory (no kustomize); the diff of a promotion is exactly what changes on the clusters. Cluster-scoped so every addon-<name> Project shares one definition.
# Output (compose-output "result"): commit = SHA now at the head of rendered/<branch>.
apiVersion: kargo.akuity.io/v1alpha1
kind: ClusterPromotionTask
metadata:
  name: render-addon
spec:
  vars:              # no defaults: Stages (kargo-pipeline chart) pass all of them; a missing one fails loudly
    - name: repoURL      # must equal the Warehouse repoURL (commitFrom looks the Freight commit up by it)
    - name: addon
    - name: chart
    - name: namespace
    - name: releaseName
    - name: env          # values overlay: envs/<env>.values.yaml
    - name: branch       # stage name; output goes to rendered/<branch>
    - name: pr           # "true": push a generated branch + PR instead of pushing rendered/<branch> directly
  steps:
    - uses: git-clone
      retry: { errorThreshold: 3 }   # network step: ride out transient DNS/registry errors
      config:
        repoURL: ${{ vars.repoURL }}
        # SPLIT: ./src is one checkout of platform-charts + platform-config; split repos => one clone per repo
        # (chart from the charts repo at its Freight commit, values from the config repo at its Freight commit)
        # rendered/<branch> first: its existence check / orphan creation is the fetch most likely to hit the network
        # (transient DNS). All network I/O then happens before any worktree exists, so a retry starts from scratch.
        checkout:
          - { branch: "rendered/${{ vars.branch }}", create: true, path: ./out }
          - { commit: "${{ commitFrom(vars.repoURL).ID }}", path: ./src }
    # helm-template only adds/overwrites files: start from an empty folder so removed resources disappear.
    # Only this addon's folder; the other addons on the branch are other pipelines' output.
    - uses: delete
      config:
        path: ./out/addons/${{ vars.addon }}
    - uses: helm-template
      retry: { errorThreshold: 3 }   # network step: ride out transient DNS/registry errors
      config:
        path: ./src/repos/platform-charts/${{ vars.chart }}
        releaseName: ${{ vars.releaseName }}
        namespace: ${{ vars.namespace }}
        buildDependencies: true      # charts/*.tgz are gitignored; deps are pinned by Chart.lock
        includeCRDs: true
        skipTests: true              # helm test pods are for `helm test`, not for the cluster
        kubeVersion: "1.34.11"       # keep in sync with fleet kubernetesVersion (hack/lint.sh checks the minor)
        # Rendered on the hub, not the worker: no lookup(), .Capabilities only knows what is listed here, and
        # chart-generated secrets/certs change on every render. Workers have no extra CRD APIs today (e.g. no
        # monitoring.coreos.com/v1), so the list stays empty; add group/version entries when they do.
        apiVersions: []
        ignoreMissingValueFiles: true
        valuesFiles:   # SPLIT: values come from platform-config, the chart (path) from platform-charts
          - ./src/repos/platform-config/addons/workers/${{ vars.addon }}/values.yaml
          - ./src/repos/platform-config/addons/workers/${{ vars.addon }}/envs/${{ vars.env }}.values.yaml
        outPath: ./out/addons/${{ vars.addon }}
        # flat: <group>-<kind>-<namespace>-<name>.yaml per resource (reviewable diffs, no chart subfolder). Caveats,
        # Kargo v1.11.4: a resource without metadata.name (generateName) goes to resource-0.yaml and every further
        # one overwrites it (the index never increments); a hook and a main resource with the same kind/namespace/
        # name share one file and the hook, written last, wins. hack/lint.sh rejects both in worker addon renders.
        outLayout: flat
    - uses: git-commit
      config:
        path: ./out
        message: "render(${{ vars.addon }}): ${{ vars.branch }} <- ${{ commitFrom(vars.repoURL).ID }}"
    # success() on every custom if: a custom if REPLACES the implicit "all previous steps succeeded" guard
    # (seen live: without it push-direct ran after git-clone had errored).
    - uses: git-push
      as: push-direct
      if: ${{ success() && vars.pr != "true" }}
      retry: { errorThreshold: 3 }   # network step (its own maxAttempts covers rebase races, not DNS/transport)
      config:
        path: ./out
        maxAttempts: 20   # every addon pipeline pushes to the same rendered/<stage> branch; each attempt rebases
    # PR flow (needs a token that can open PRs; the deploy key can only push). Inside a task, earlier outputs are
    # read via task.outputs and status() takes the task-local alias: aliases get namespaced when the task is
    # inflated into the Promotion.
    - uses: git-push
      as: push
      if: ${{ success() && vars.pr == "true" }}
      retry: { errorThreshold: 3 }   # network step
      config: { path: ./out, generateTargetBranch: true }
    - uses: git-open-pr
      as: open-pr
      if: ${{ success() && vars.pr == "true" }}
      retry: { errorThreshold: 3 }   # network step
      config:
        repoURL: ${{ vars.repoURL }}
        sourceBranch: ${{ task.outputs.push.branch }}
        targetBranch: rendered/${{ vars.branch }}
        title: "render(${{ vars.addon }}): ${{ vars.branch }}"
    - uses: git-wait-for-pr
      as: wait-for-pr
      if: ${{ success() && vars.pr == "true" && status('open-pr') != 'Skipped' }}
      retry: { errorThreshold: 3 }   # network step (polls the PR)
      config:
        repoURL: ${{ vars.repoURL }}
        prNumber: ${{ task.outputs['open-pr'].pr.id }}
    # PR flow: prefer the merge commit on rendered/<branch>; the pushed SHA (generated branch) only as a fallback.
    # Skipped steps have no outputs: ?. / ?? (expr-lang v1.17) keep the unused side from erroring.
    - uses: compose-output
      as: result
      config:
        commit: >-
          ${{ vars.pr == "true" ? (task.outputs['wait-for-pr']?.commit ?? task.outputs.push.commit) : task.outputs['push-direct'].commit }}
