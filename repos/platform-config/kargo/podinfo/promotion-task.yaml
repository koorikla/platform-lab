# Promotion = commit the new image tag into the env's values file. Argo CD (auto-sync, via agents) does the rest,
# so every cluster labelled with that env moves together; single-cluster pins live in clusters/<cluster>/values.yaml.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: bump-env-values
  namespace: podinfo
spec:
  vars:
    - name: env
    - name: repoURL
      value: git@github.com:koorikla/platform-lab.git   # deploy key (hack/kargo-deploy-key.sh)
    - name: image
      value: ghcr.io/stefanprodan/podinfo
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.repoURL }}
        checkout:
          - branch: main
            path: ./src
    - uses: yaml-update
      config:
        path: ./src/repos/apps/podinfo/envs/${{ vars.env }}/values.yaml
        updates:
          - key: podinfo.image.tag
            value: ${{ imageFrom(vars.image).Tag }}
    - uses: git-commit
      config:
        path: ./src
        message: "promote(podinfo): ${{ vars.env }} -> ${{ imageFrom(vars.image).Tag }}"
    - uses: git-push              # TODO prod: git-open-pr + git-wait-for-pr instead of pushing to main
      config:
        path: ./src
