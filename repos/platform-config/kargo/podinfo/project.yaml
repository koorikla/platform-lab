# Declared explicitly so creation order doesn't matter: Kargo refuses to adopt an unlabelled namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: podinfo
  labels:
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: podinfo
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: podinfo
  namespace: podinfo
spec:
  promotionPolicies:
    - stageSelector: { name: dev }
      autoPromotionEnabled: true
