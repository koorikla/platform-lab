# Hub overrides. Applied by GitOps only (bootstrap installs chart defaults), so Argo is up before it depends on the principal.
argo-cd:
  configs:
    params:
      # argocd-agent hybrid mode: all redis traffic goes through the principal's redis proxy, which serves
      # agent-owned keys (resource trees of remote apps) and forwards the rest to argocd-redis.
      redis.server: argocd-agent-redis-proxy:6379
    cm:
      # SSO via Thunder (#19). url = where browsers reach Argo CD (`make ui` port-forward); the OIDC redirect is
      # url + /auth/callback (v3.5 does PKCE server-side). Local admin (admin.enabled, chart default true) is break-glass.
      url: http://localhost:8090
      # Public client, PKCE, no secret. The issuer must resolve from the browser (*.localhost + the gateway forward on
      # 8080) AND from argocd-server (hub CoreDNS rewrite to the OpenChoreo gateway, #11/#12). The provider is queried
      # lazily: while Thunder is unreachable the SSO button fails, local admin keeps working.
      oidc.config: |
        name: Thunder
        issuer: http://thunder.openchoreo.localhost:8080
        clientID: argocd
        enablePKCEAuthentication: true
        # groups: Thunder 0.28.0 accepts it (though discovery's scopes_supported omits it) and only then puts the groups
        # claim in the ID token (app scope_claims)
        requestedScopes: [openid, profile, email, groups]
    rbac:
      # Thunder groups (the names OpenChoreo's authz already binds). No policy.default: a Thunder user in none of these
      # groups sees nothing. Project-scoped grants (developers sync the workloads apps) are AppProject roles in
      # repos/platform-config/argocd/projects.yaml; argocd-server evaluates both together.
      policy.csv: |
        g, admins, role:admin
        # platform-mgmt (the hub itself: root, addons, fleet) only sync + resource actions: create/update/delete/override
        # there would reshape the hub, i.e. admin. Full Application/ApplicationSet rights only in the worker and app
        # projects. Everything else (clusters, repos, projects, accounts, certs) read-only: declared in git or admin's.
        p, role:platform-engineer, applications, sync, platform-mgmt/*, allow
        p, role:platform-engineer, applications, action/*, platform-mgmt/*, allow
        p, role:platform-engineer, applications, *, platform-workers/*, allow
        p, role:platform-engineer, applications, *, workloads/*, allow
        p, role:platform-engineer, applicationsets, *, platform-workers/*, allow
        p, role:platform-engineer, applicationsets, *, workloads/*, allow
        g, role:platform-engineer, role:readonly
        g, platform-engineers, role:platform-engineer
        g, developers, role:readonly
        g, sres, role:readonly
