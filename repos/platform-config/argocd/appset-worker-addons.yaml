# addon x worker cluster. Source = plain YAML that Kargo rendered (ClusterPromotionTask render-addon) into
# rendered/<branch>:addons/<addon>/, branch = <env>, or <env>-canary for clusters with label platform.lab/ring=canary
# (fleet file `ring:`). Chart version and values travel inside the rendered commit: promoting = Kargo moving the branch,
# nothing is resolved here. addon.yaml on main stays the on/off switch (.disabled => no Application; the stale rendered
# folder is removed with hack/rendered-prune.sh). Apps carry argocd-agent=true so the principal ships them to the agent.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: worker-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Disabling an addon (or a cluster losing role=worker) deletes the Application but leaves what it deployed running:
  # removing an addon from workers is a deliberate step, not a side effect of a rename or a generator hiccup.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/koorikla/platform-lab.git      # platform-config repo
              revision: main
              pathParamPrefix: addonfile        # addon name = folder name (== addon.name, hack/lint.sh), like Kargo's
              files:
                - path: repos/platform-config/addons/workers/*/addon.yaml
          - clusters:
              selector:
                matchLabels:
                  platform.lab/role: worker
              values:
                env: '{{ index .metadata.labels "platform.lab/env" }}'
                # `index` yields "" for a missing label (a field access would fail under missingkey=error):
                # cluster secrets from before the ring label existed count as stable. A canary branch exists only
                # where kargo-pipeline has a <env>-canary stage (dev today).
                branch: '{{ index .metadata.labels "platform.lab/env" }}{{ if eq (index .metadata.labels "platform.lab/ring") "canary" }}-canary{{ end }}'
                ring: '{{ if eq (index .metadata.labels "platform.lab/ring") "canary" }}canary{{ else }}stable{{ end }}'
  # No progressive sync (RollingSync) on purpose: decision + how to enable it in the design doc addendum (#27).
  template:
    metadata:
      name: '{{ .addonfile.path.basename }}-{{ .name }}'
      labels:
        argocd-agent: "true"
        platform.lab/addon: '{{ .addonfile.path.basename }}'
        platform.lab/env: '{{ .values.env }}'
        platform.lab/ring: '{{ .values.ring }}'      # same rule as the branch; UI filters, Kargo verification, RollingSync
        platform.lab/cluster: '{{ .name }}'
    spec:
      project: platform-workers
      source:
        repoURL: https://github.com/koorikla/platform-lab.git            # repo Kargo pushes rendered/* to
        targetRevision: 'rendered/{{ .values.branch }}'
        path: 'addons/{{ .addonfile.path.basename }}'
        # plain manifests, no helm/kustomize on the worker. Kargo's flat layout has no subfolders today; recurse keeps
        # a chart-per-folder layout working too.
        directory:
          recurse: true
      destination:
        name: '{{ .name }}'
        namespace: '{{ dig "namespace" .addonfile.path.basename .addon }}'   # same default as kargo-pipeline
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry: { limit: 20, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
        syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
