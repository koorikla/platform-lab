# LEGACY, retired by #17: app x worker-cluster, the app's chart/ synced from main with envs/<env>/values.yaml.
# Nothing promotes it any more (Kargo renders apps to rendered/*:apps/<app>/, #16): the image is the chart's default
# tag. The clusters/<cluster>/values.yaml override is optional and unused (per-cluster app values are gone).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/koorikla/platform-lab.git      # apps repo
              revision: main
              directories:
                - path: repos/apps/*
          - clusters:
              selector:
                matchLabels:
                  platform.lab/role: worker
              values:
                env: '{{ index .metadata.labels "platform.lab/env" }}'
  template:
    metadata:
      name: '{{ .path.basename }}-{{ .name }}'
      labels:
        argocd-agent: "true"
        platform.lab/app: '{{ .path.basename }}'
        platform.lab/env: '{{ .values.env }}'
    spec:
      project: workloads
      source:
        repoURL: https://github.com/koorikla/platform-lab.git
        targetRevision: main
        path: '{{ .path.path }}/chart'
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - '../envs/{{ .values.env }}/values.yaml'
            - '../clusters/{{ .name }}/values.yaml'
      destination:
        name: '{{ .name }}'
        namespace: '{{ .path.basename }}'
      syncPolicy:   # no preserveResourcesOnDeletion: removing an app from repos/apps removes its workload
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
