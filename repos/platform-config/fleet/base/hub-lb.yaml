# HAProxy config for the hub's CAPD load balancer (container `<hub>-lb`): CAPD's default template plus TCP frontends
# for hub NodePorts that workers dial: argocd-agent principal (30443), OpenBao (30820, plain HTTP in lab mode) and
# the OpenChoreo cluster-gateway (30843, mTLS websocket; TCP passthrough, the gateway terminates TLS).
# Backends = control-plane nodes. Labelled for `clusterctl move`, because the hub's DockerCluster references it.
# CAPD renders this template ONLY when a control-plane machine is created or deleted (DockerMachine
# status.loadBalancerConfigured), not when the ConfigMap changes. A fresh `make up` picks edits up; on a running hub
# re-render by hand once (what CAPD does itself: write haproxy.cfg, SIGHUP):  hack/hub-lb-reload.sh
apiVersion: v1
kind: ConfigMap
metadata:
  name: k3s-docker-hub-lb
  namespace: fleet
  labels:
    clusterctl.cluster.x-k8s.io/move: ""
data:
  value: |
    global
      log /dev/log local0
      log /dev/log local1 notice
      daemon
      maxconn 100000

    resolvers docker
      nameserver dns 127.0.0.11:53

    defaults
      log global
      mode tcp
      option dontlognull
      timeout connect 5000
      timeout client 50000
      timeout server 50000
      default-server init-addr none

    frontend stats
      mode http
      bind *:8404
      stats enable
      stats uri /stats
      stats refresh 1s
      stats admin if TRUE

    frontend control-plane
      bind *:{{ .FrontendControlPlanePort }}
      {{ if .IPv6 -}}
      bind :::{{ .FrontendControlPlanePort }};
      {{- end }}
      default_backend kube-apiservers

    backend kube-apiservers
      option httpchk GET /healthz
      {{range $server, $backend := .BackendServers}}
      server {{ $server }} {{ JoinHostPort $backend.Address $.BackendControlPlanePort }} weight {{ $backend.Weight }} check check-ssl verify none resolvers docker resolve-prefer {{ if $.IPv6 -}} ipv6 {{- else -}} ipv4 {{- end }}
      {{- end}}

    frontend argocd-agent-principal
      bind *:30443
      default_backend argocd-agent-principal

    backend argocd-agent-principal
      {{range $server, $backend := .BackendServers}}
      server {{ $server }} {{ JoinHostPort $backend.Address "30443" }} check resolvers docker resolve-prefer ipv4
      {{- end}}

    frontend openbao
      bind *:30820
      default_backend openbao

    backend openbao
      {{range $server, $backend := .BackendServers}}
      server {{ $server }} {{ JoinHostPort $backend.Address "30820" }} check resolvers docker resolve-prefer ipv4
      {{- end}}

    frontend openchoreo-cluster-gateway
      bind *:30843
      default_backend openchoreo-cluster-gateway

    backend openchoreo-cluster-gateway
      {{range $server, $backend := .BackendServers}}
      server {{ $server }} {{ JoinHostPort $backend.Address "30843" }} check resolvers docker resolve-prefer ipv4
      {{- end}}
