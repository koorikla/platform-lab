# k3s (bootstrap + control plane) on CAPD. Sibling classes later: k3s-openstack, eks.
# Variable managementCluster=true turns a cluster into a self-hosted hub: docker.sock in every node (CAPD runs there
# after the pivot) and an LB that also fronts the argocd-agent principal, so workers dial the stable `<name>-lb`.
apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: k3s-docker
  namespace: fleet
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KThreesControlPlaneTemplate
      name: k3s-docker-control-plane
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: DockerMachineTemplate
        name: k3s-docker-control-plane
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: DockerClusterTemplate
      name: k3s-docker
  workers:
    machineDeployments:
      - class: k3s-default-worker
        template:
          bootstrap:
            ref:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
              kind: KThreesConfigTemplate
              name: k3s-docker-worker
          infrastructure:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: DockerMachineTemplate
              name: k3s-docker-worker
  variables:
    - name: kindImageVersion         # only the node OS; k3s itself is installed at boot (topology.version)
      required: true
      schema:
        openAPIV3Schema:
          type: string
          default: v1.34.0
    - name: managementCluster
      required: false
      schema:
        openAPIV3Schema:
          type: boolean
          default: false
  patches:
    - name: customImage
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: DockerMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names: [k3s-default-worker]
          jsonPatches:
            - op: add
              path: /spec/template/spec/customImage
              valueFrom:
                template: kindest/node:{{ .kindImageVersion }}
    - name: managementCluster
      enabledIf: "{{ .managementCluster }}"
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: DockerMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names: [k3s-default-worker]
          jsonPatches:
            - op: add
              path: /spec/template/spec/extraMounts
              value:
                - { containerPath: /var/run/docker.sock, hostPath: /var/run/docker.sock }
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: DockerClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/loadBalancer
              value:
                customHAProxyConfigTemplateRef: { name: k3s-docker-hub-lb }
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerClusterTemplate
metadata:
  name: k3s-docker
  namespace: fleet
spec:
  template:
    spec: {}
---
# CAPD execs the bootstrap the moment systemd is up, while kindest/node's entrypoint may still be fixing DNS. The
# bootstrap is `curl get.k3s.io | sh` (exit status = sh's), so a failed download would "succeed" without k3s.
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KThreesControlPlaneTemplate
metadata:
  name: k3s-docker-control-plane
  namespace: fleet
spec:
  template:
    spec:
      kthreesConfigSpec:
        preK3sCommands:
          - until curl -sfI --max-time 5 https://get.k3s.io >/dev/null; do sleep 2; done
        serverConfig:
          tlsSan: [0.0.0.0]
          disableComponents: [traefik]   # ingress comes from kgateway (OpenChoreo) where needed
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerMachineTemplate
metadata:
  name: k3s-docker-control-plane
  namespace: fleet
spec:
  template:
    spec: {}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KThreesConfigTemplate
metadata:
  name: k3s-docker-worker
  namespace: fleet
spec:
  template:
    spec:
      preK3sCommands:
        - until curl -sfI --max-time 5 https://get.k3s.io >/dev/null; do sleep 2; done
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerMachineTemplate
metadata:
  name: k3s-docker-worker
  namespace: fleet
spec:
  template:
    spec: {}
