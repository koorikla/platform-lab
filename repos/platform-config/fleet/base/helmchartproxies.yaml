# What CAPI (CAAPH) injects into every worker at birth: the minimum needed for the cluster to phone home, plus
# everything bound to the cluster's identity. One umbrella chart, one release per worker (platform-charts/worker-birth-kit):
#   argo-cd worker profile      app-controller/repo-server/redis
#   argocd-agent                dials the hub principal (mgmt-lb:30443) with the identity ESO pulls
#   external-secrets            pull model: the worker fetches its own secrets from the hub's OpenBao
#   store hub-openbao + agent ExternalSecrets + coredns-custom
# valuesTemplate renders the only per-cluster value, the cluster name. Everything after that is delivered by Argo CD
# through the agent (worker-addons ApplicationSet).
# CAAPH only installs from Helm/OCI registries, not git paths -> the chart published by charts.yaml. A kit change
# bumps both versions in one PR; CAAPH retries until charts.yaml has published it (a minute or two after merge).
# TODO: split per env to stage birth-kit upgrades.
apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: worker-birth-kit
  namespace: fleet
spec:
  clusterSelector:
    matchLabels:
      platform.lab/role: worker
  repoURL: oci://ghcr.io/koorikla/platform-charts
  chartName: worker-birth-kit
  version: 0.1.0                       # = repos/platform-charts/worker-birth-kit/Chart.yaml (hack/tests/test_birth_kit.sh)
  releaseName: worker-birth-kit        # = the owner written into the chart's crds/ (hack/birth-kit-crds.sh)
  namespace: argocd                    # argo-cd + agent; ESO goes to external-secrets (the chart creates that one)
  options:
    wait: true                         # Ready = agent up, i.e. ESO pulled its identity from OpenBao (~90 s at birth)
    timeout: 10m
    install:
      createNamespace: true
  valuesTemplate: |
    clusterName: {{ .Cluster.metadata.name }}
