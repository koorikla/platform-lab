# k3s (bootstrap + control plane) on CAPD. Sibling classes later: k3s-openstack, eks.
# Variable managementCluster=true turns a cluster into a self-hosted hub: docker.sock in every node (CAPD runs there
# after the pivot) and an LB that also fronts the argocd-agent principal, so workers dial the stable `<name>-lb`.
apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: k3s-docker
  namespace: fleet
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KThreesControlPlaneTemplate
      name: k3s-docker-control-plane
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: DockerMachineTemplate
        name: k3s-docker-control-plane
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: DockerClusterTemplate
      name: k3s-docker
  workers:
    machineDeployments:
      - class: k3s-default-worker
        template:
          bootstrap:
            ref:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
              kind: KThreesConfigTemplate
              name: k3s-docker-worker
          infrastructure:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: DockerMachineTemplate
              name: k3s-docker-worker
  variables:
    - name: kindImageVersion         # only the node OS; k3s itself is installed at boot (topology.version)
      required: true
      schema:
        openAPIV3Schema:
          type: string
          default: v1.34.0
    - name: managementCluster
      required: false
      schema:
        openAPIV3Schema:
          type: boolean
          default: false
    # Tolerate a CPU-starved host (#76). Default false and opt-in per fleet file, because any change to the control
    # plane's KThreesConfigSpec REPLACES the control-plane machine (KCP rollout: new node joins etcd, old one is
    # removed). Default true would roll every existing cluster whenever its Cluster is next applied.
    - name: slowHostTolerance
      required: false
      schema:
        openAPIV3Schema:
          type: boolean
          default: false
  patches:
    - name: customImage
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: DockerMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names: [k3s-default-worker]
          jsonPatches:
            - op: add
              path: /spec/template/spec/customImage
              valueFrom:
                template: kindest/node:{{ .kindImageVersion }}
    - name: managementCluster
      enabledIf: "{{ .managementCluster }}"
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: DockerMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names: [k3s-default-worker]
          jsonPatches:
            - op: add
              path: /spec/template/spec/extraMounts
              value:
                - { containerPath: /var/run/docker.sock, hostPath: /var/run/docker.sock }
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: DockerClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/loadBalancer
              value:
                customHAProxyConfigTemplateRef: { name: k3s-docker-hub-lb }
    # k3s runs kube-controller-manager, kube-scheduler and cloud-controller-manager (started because servicelb is on)
    # in its own process; when one of them can't renew its lease within renew-deadline (default 10 s) it exits with
    # "leaderelection lost" and takes k3s down with it. On a saturated Docker VM the apiserver/etcd stall for longer.
    # With one server there is no one to fail over to, so long timings cost nothing; with 3 servers a dead leader is
    # replaced after ~60 s instead of ~15 s. retry-period 10 s also cuts lease writes 5x (3 leases every 2 s before).
    # A k3s config drop-in because cluster-api-k3s v0.4.0 has serverConfig fields for the controller-manager and
    # scheduler but none for the cloud-controller-manager; keys end in "+" to append to the lists in config.yaml.
    # etcd is left alone: k3s already runs it with heartbeat 500 ms / election 5000 ms (5x etcd's defaults), and a
    # single member has no elections; its slow-apply warnings are fixed by less write load, not by timeouts.
    - name: slowHostTolerance
      enabledIf: "{{ .slowHostTolerance }}"
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KThreesControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kthreesConfigSpec/files   # the template has no files of its own (a test checks)
              value:
                - path: /etc/rancher/k3s/config.yaml.d/50-slow-host.yaml
                  owner: root:root
                  permissions: "0600"
                  content: |
                    kube-controller-manager-arg+: [leader-elect-lease-duration=60s, leader-elect-renew-deadline=40s, leader-elect-retry-period=10s]
                    kube-scheduler-arg+: [leader-elect-lease-duration=60s, leader-elect-renew-deadline=40s, leader-elect-retry-period=10s]
                    kube-cloud-controller-manager-arg+: [leader-elect-lease-duration=60s, leader-elect-renew-deadline=40s, leader-elect-retry-period=10s]
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerClusterTemplate
metadata:
  name: k3s-docker
  namespace: fleet
spec:
  template:
    spec: {}
---
# CAPD execs the bootstrap the moment systemd is up, while kindest/node's entrypoint may still be fixing DNS. The
# bootstrap is `curl get.k3s.io | sh` (exit status = sh's), so a failed download would "succeed" without k3s.
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KThreesControlPlaneTemplate
metadata:
  name: k3s-docker-control-plane
  namespace: fleet
spec:
  template:
    spec:
      kthreesConfigSpec:
        preK3sCommands:
          - until curl -sfI --max-time 5 https://get.k3s.io >/dev/null; do sleep 2; done
        serverConfig:
          tlsSan: [0.0.0.0]
          disableComponents: [traefik]   # ingress comes from kgateway (OpenChoreo) where needed
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerMachineTemplate
metadata:
  name: k3s-docker-control-plane
  namespace: fleet
spec:
  template:
    spec: {}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KThreesConfigTemplate
metadata:
  name: k3s-docker-worker
  namespace: fleet
spec:
  template:
    spec:
      preK3sCommands:
        - until curl -sfI --max-time 5 https://get.k3s.io >/dev/null; do sleep 2; done
        # k3s-agent (Type=notify) only reports READY once CAPD removed the cloud-provider taint, but CAPD sets the
        # providerID only after this bootstrap returns -> the install's `systemctl restart` would block until timeout.
        - mkdir -p /etc/systemd/system/k3s-agent.service.d && printf '[Service]\nType=exec\n' > /etc/systemd/system/k3s-agent.service.d/capd.conf
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerMachineTemplate
metadata:
  name: k3s-docker-worker
  namespace: fleet
spec:
  template:
    spec: {}
