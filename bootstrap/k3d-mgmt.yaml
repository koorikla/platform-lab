# Management cluster (hub): k3s in docker via k3d. Node container name = k3d-mgmt-server-0, used as the hub's DNS name
# by workers. It joins docker network "kind" because that is where CAPD creates worker machines and their LBs.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: mgmt
servers: 1
agents: 0
image: rancher/k3s:v1.34.11-k3s1   # keep within the Kubernetes range supported by the pinned CAPI core
network: kind
volumes:
  - volume: /var/run/docker.sock:/var/run/docker.sock   # CAPD creates worker clusters as sibling containers
    nodeFilters: [server:0]
ports:
  - port: 8080:30080               # Argo CD UI
    nodeFilters: [server:0]
  - port: 8081:30081               # Kargo UI
    nodeFilters: [server:0]
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik     # UIs are NodePorts; no ingress needed on the hub (yet)
        nodeFilters: [server:*]
      - arg: --disable=servicelb
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
