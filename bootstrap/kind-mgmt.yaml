# Management cluster. Node container name = mgmt-control-plane (used as hub DNS name by workers on the "kind" docker network).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mgmt
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /var/run/docker.sock   # CAPD creates worker clusters as sibling containers
        containerPath: /var/run/docker.sock
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080 }   # Argo CD UI
      - { containerPort: 30081, hostPort: 8081 }   # Kargo UI
