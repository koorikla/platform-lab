# The only manifest applied by hand. Everything else is pulled from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/koorikla/platform-lab.git
    targetRevision: main
    path: repos/platform-config/argocd
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # server-side apply: the hub diffs server-side, so fields removed from child Applications must be pruned by SSA
    syncOptions: [ServerSideApply=true]
